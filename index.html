<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Click Media</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a14;--pn:#0b1424;--ln:#1a2a44;--cy:#22d3ee;--tx:#e6f1f7;--mu:#7f93a8;--rd:#ff5d6c;--gn:#34d399}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2em;color:var(--cy)}
.logo i{width:26px;height:26px;border:2px solid var(--cy);border-left-color:transparent;border-bottom-color:transparent;display:grid;place-items:center;font-style:normal;font-size:13px;letter-spacing:0}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--ln)}
nav button{background:none;border:0;color:var(--mu);padding:8px 14px;font:inherit;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav button.on{color:var(--cy);border-color:var(--cy)}
main{max-width:860px;margin:0 auto;padding:16px}
.box{background:var(--pn);border:1px solid var(--ln);padding:14px;margin-bottom:14px}
.box.br{border-top-color:var(--cy);border-right-color:var(--cy)}
h3{margin:0 0 10px;font-size:16px}
label{display:block;color:var(--mu);font-size:13px;margin-bottom:8px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);padding:9px;font:inherit;margin-top:3px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
button.p{background:var(--cy);color:#041018;border:0;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
button.s{background:none;border:1px solid var(--ln);color:var(--tx);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
button.s.d{color:var(--rd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln);flex-wrap:wrap}
.row:first-of-type{border-top:0}.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:600}
.neg{color:var(--rd)}.pos{color:var(--gn)}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.empty{color:var(--mu);text-align:center;padding:18px}
img.lg{height:44px;display:block;mix-blend-mode:lighten}img.lg.big{height:auto;width:180px;margin:0 auto 14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--cy);color:#041018;padding:8px 18px;font-weight:600}
.row select{width:auto;margin:0}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
</style>
</head>

const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(+n||0).toFixed(2)+' د.أ',today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const day=d=>d?new Date(d).toLocaleDateString('ar-JO',{weekday:'long',day:'numeric',month:'short'}):'';

const list=async(c,...w)=>(await getDocs(w.length?query(collection(db,c),...w):collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
const F=(id,l,t='text',o)=>`<label>${l}${o?`<select id="${id}">${o.map(x=>`<option value="${h(x[0])}">${h(x[1])}</option>`).join('')}</select>`:`<input id="${id}" type="${t}"${t=='date'?` value="${today()}"`:''}>`}</label>`;

const empty=t=>`<div class="empty">${t}</div>`;
let me=null,cur=null;
window.go=async(fn)=>{try{await fn();show(cur)}catch(e){alert('تعذّر الحفظ: '+(e.message||e))}};

async function mkUser(email,pass){const a=getAuth(initializeApp(cfg,'s'+Date.now()));const r=await createUserWithEmailAndPassword(a,email,pass);await signOut(a);return r.user.uid}
const sum=(a,k,f=()=>true)=>a.filter(f).reduce((s,x)=>s+ +x[k],0);
const monthKey=(d=0)=>{const t=new Date();t.setMonth(t.getMonth()+d);return t.toISOString().slice(0,7)};
const endDate=c=>{const d=new Date(c.start);d.setMonth(d.getMonth()+ +c.plan);return d};
const daysLeft=c=>Math.ceil((endDate(c)-new Date())/864e5);

const load=(...w)=>Promise.all(['cm_invoices','cm_payments','cm_expenses'].map(c=>list(c,...w)));
const inM=(a,k,p)=>sum(a,k,x=>x.date.startsWith(p));
const entryRows=(inv,pay,ex,adm)=>[...inv.map(x=>({c:'invoices',id:x.id,d:x.date,t:'فاتورة · '+x.clientName,s:[x.service,x.phone].filter(Boolean).join(' · '),a:x.price,e:x.empName})),...pay.map(x=>({c:'payments',id:x.id,d:x.date,t:'استلام · '+x.clientName,s:x.note||'',a:x.amount,e:x.empName})),...ex.map(x=>({c:'expenses',id:x.id,d:x.date,t:'مصروف · '+x.desc,s:x.status=='pending'?'بانتظار الرجوع':'',a:x.amount,e:x.empName}))].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,150).map(r=>`<div class="row"><div><b>${h(r.t)}</b><div class="mu">${r.d} · ${h(r.e)}${r.s?' · '+h(r.s):''}</div></div><div>${money(r.a)}${adm?` <button class="s d" onclick="confirm('حذف؟')&&go(()=>del('${r.c}','${r.id}'))">حذف</button>`:''}</div></div>`).join('')||empty('لا توجد حركات بعد.');

const T={
async week(){
 const adm=me.role=='admin',days=wkRange(),td=today();
 const[em,ts]=await Promise.all([adm?list('cm_users',where('role','==','employee')):[],list('cm_tasks',...(adm?[]:[where('empId','==',me.uid)]))]);
 const inW=ts.filter(t=>t.date>=days[0]&&t.date<=days[6]),wt=inW.filter(t=>!fEmp||t.empId==fEmp).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const cnt=e=>inW.filter(t=>t.empId==e.id).length;
 const nav=`<div class="box" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="s" onclick="wkMove(-1)">› الأسبوع السابق</button><button class="s" onclick="wkMove(0)">هذا الأسبوع</button><button class="s" onclick="wkMove(1)">الأسبوع القادم ‹</button><span class="mu" style="margin-inline-start:auto">${day(days[0])} – ${day(days[6])}</span>${adm?`<select style="width:auto;margin:0" onchange="setF(this.value)"><option value="">كل الموظفين</option>${em.map(e=>`<option value="${e.id}"${e.id==fEmp?' selected':''}>${h(e.name)}</option>`).join('')}</select>`:''}</div>`;
 const form=adm?(em.length?`<div class="box br"><h3>نزلة جديدة</h3><div class="g">${F('t1','نوع الشغل (تصوير، مونتاج، منيو...)')}${F('t2','المحل / العميل')}<div style="margin-bottom:8px"><div class="mu">الموظفين (اختر واحد أو أكثر) <button type="button" class="s" onclick="document.querySelectorAll('#t3 input').forEach(i=>i.checked=true)">الكل</button></div><div id="t3" style="display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px">${em.map(e=>`<label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--tx)"><input type="checkbox" value="${e.id}" data-n="${h(e.name)}" style="width:auto;margin:0">${h(e.name)}</label>`).join('')}</div></div>${F('t4','التاريخ','date')}${F('t5','الوقت','time')}${F('t6','الموقع')}</div><button class="p" onclick="go(addTask)">حفظ النزلة</button></div>`:empty('أضف موظفاً أولاً من تبويب الموظفين.')):'';
 const sum2=adm?`<div class="box"><h3>ملخص الأسبوع</h3><div class="mu">${inW.length} نزلة · ${new Set(inW.map(t=>t.clientName)).size} محل/عميل</div>${em.map(e=>`<div class="row"><b>${h(e.name)}</b><span class="${cnt(e)?'':'neg'}">${cnt(e)?cnt(e)+' نزلة':'فاضي هالأسبوع'}</span></div>`).join('')}</div>`:'';
 return form+nav+sum2+days.map(d=>{const a=wt.filter(t=>t.date==d);return`<div class="box ${d==td?'br':''}"><h3>${day(d)}${d==td?' · اليوم':''}${adm&&em.length?` <button class="s" onclick="pickDay('${d}')">+ نزلة</button>`:''}</h3>${a.map(t=>tcard(t,adm)).join('')||'<div class="mu">لا نزلات</div>'}</div>`}).join('')},
async dash(){
 const[inv,pay,ex]=await load(),em=await list('cm_users',where('role','==','employee')),subs=await list('cm_subs');
 const m=monthKey(),p=monthKey(-1),rec=inM(pay,'amount',m),sm=inM(subs,'price',m),exp=inM(ex,'amount',m),n=rec+sm-exp,pn=inM(pay,'amount',p)+inM(subs,'price',p)-inM(ex,'amount',p);
 return`<div class="k"><div class="box"><div class="mu">فواتير الشهر</div><div class="big">${money(inM(inv,'price',m))}</div></div><div class="box"><div class="mu">المستلم</div><div class="big">${money(rec)}</div></div><div class="box"><div class="mu">دخل الاشتراكات</div><div class="big">${money(sm)}</div></div><div class="box"><div class="mu">المصاريف</div><div class="big">${money(exp)}</div></div><div class="box"><div class="mu">${n<0?'خسارة':'الصافي'}</div><div class="big ${n<0?'neg':'pos'}">${money(n)}</div></div></div>
 <div class="box"><div class="mu">الشهر الماضي: الصافي <span class="${pn<0?'neg':''}">${money(pn)}</span></div></div>
 <div class="box br"><h3>حساب الموظفين</h3>${em.map(e=>{const o=opn(pay,e.id),w=owe(ex,e.id);return`<div class="row"><div><b>${h(e.name)}</b><div class="mu">استلم من العملاء ${money(o)} · دفع من جيبه ${money(w)}</div><div>${netTxt(o-w)}</div></div>${o||w?`<button class="s" onclick="confirm('تسوية حساب ${h(e.name)}؟')&&go(()=>settle('${e.id}'))">تمت التسوية</button>`:''}</div>`}).join('')||empty('أضف موظفاً من تبويب الموظفين.')}</div>
 <div class="box"><h3>مصروف للإدارة</h3><div class="g">${F('x1','الوصف')}${F('x2','المبلغ','number')}</div><button class="p" onclick="go(()=>addExp(true))">حفظ</button></div>`},
async staff(){
 const em=await list('cm_users',where('role','==','employee')),[inv,pay,ex]=await load(),ts=await list('cm_tasks'),d=wkRange(),m=monthKey();
 return`<div class="box br"><h3>موظف جديد</h3><div class="g">${F('e1','الاسم')}${F('e2','إيميل الدخول','email')}${F('e3','كلمة المرور (6 أحرف+)')}${F('e4','الأجر الشهري','number')}</div><button class="p" onclick="go(addStaff)">إنشاء الموظف</button></div>
 <div class="box"><div class="mu">مجموع الأجور الشهرية (${em.length} موظف)</div><div class="big">${money(sum(em,'wage'))}</div></div>
 <div class="box">${em.map(e=>{const wt=ts.filter(t=>t.empId==e.id&&t.date>=d[0]&&t.date<=d[6]).length,fv=inv.filter(x=>x.empId==e.id&&x.date.startsWith(m)).length,o=opn(pay,e.id),w=owe(ex,e.id);return`<div class="row"><div><b>${h(e.name)}</b><div class="mu">الأجر ${money(e.wage)} · ${wt} نزلة هالأسبوع · ${fv} فاتورة هالشهر</div><div class="mu">${netTxt(o-w)}</div></div></div>`}).join('')||empty('لا يوجد موظفين بعد.')}</div>`},
async subs(){
 const all=await list('cm_subs'),m=monthKey(),p=monthKey(-1),L={};
 all.forEach(c=>{const k=(c.clientName+'|'+(c.phone||'')).toLowerCase();if(!L[k]||endDate(c)>endDate(L[k]))L[k]=c});
 const cl=Object.values(L).sort((a,b)=>daysLeft(a)-daysLeft(b)),act=cl.filter(c=>daysLeft(c)>=0),old=cl.filter(c=>daysLeft(c)<0),soon=act.filter(c=>daysLeft(c)<=7);
 return`<div class="k"><div class="box"><div class="mu">اشتراكات فعّالة</div><div class="big">${act.length}</div></div><div class="box"><div class="mu">تنتهي خلال 7 أيام</div><div class="big ${soon.length?'neg':''}">${soon.length}</div></div><div class="box"><div class="mu">دخل الاشتراكات هالشهر</div><div class="big pos">${money(inM(all,'price',m))}</div></div><div class="box"><div class="mu">الشهر الماضي</div><div class="big">${money(inM(all,'price',p))}</div></div></div>
 <div class="box br"><h3>اشتراك جديد</h3><div class="g">${F('s1','اسم العميل')}${F('s2','رقم الهاتف','tel')}<label>نوع الباقة<select id="s5">${PK.map(x=>`<option>${x}</option>`).join('')}</select></label><label>المدة<select id="s3" onchange="document.getElementById('s4').value=this.selectedOptions[0].dataset.p">${PLANS.map(x=>`<option value="${x[0]}" data-p="${x[2]}">${x[1]}</option>`).join('')}</select></label><label>السعر<input id="s4" type="number" value="${PLANS[0][2]}"></label>${F('s6','تاريخ البدء','date')}</div><button class="p" onclick="go(addSub)">حفظ الاشتراك</button></div>
 <div class="box"><h3>الاشتراكات الفعّالة</h3>${act.map(sRow).join('')||empty('لا اشتراكات فعّالة.')}</div>
 ${old.length?`<div class="box"><h3>منتهية</h3>${old.map(sRow).join('')}</div>`:''}`},
async fin(){
 const[inv,pay,ex]=await load(),m=monthKey(),mx=ex.filter(x=>x.date.startsWith(m)),by={},srt=a=>[...a].sort((x,y)=>y.date.localeCompare(x.date));
 mx.forEach(x=>{const c=x.cat||'أخرى';by[c]=(by[c]||0)+ +x.amount});
 const dl=(c,id)=>`<button class="s d" onclick="confirm('حذف؟')&&go(()=>del('${c}','${id}'))">حذف</button>`;
 return`<div class="k"><div class="box"><div class="mu">فواتير الشهر</div><div class="big">${money(inM(inv,'price',m))}</div></div><div class="box"><div class="mu">مصاريف الشهر</div><div class="big neg">${money(sum(mx,'amount'))}</div></div></div>
 <div class="box br"><h3>مصروف شركة جديد</h3><div class="g">${F('c1','الوصف')}${F('c2','المبلغ','number')}${F('c3','النوع','',CATS.map(c=>[c,c]))}${F('c4','التاريخ','date')}</div><button class="p" onclick="go(addCo)">حفظ المصروف</button></div>
 <div class="box"><h3>المصاريف حسب النوع (هالشهر)</h3>${Object.entries(by).map(([c,a])=>`<div class="row"><span>${h(c)}</span><b>${money(a)}</b></div>`).join('')||empty('لا مصاريف هالشهر.')}</div>
 <div class="box"><h3>مصاريف الشركة</h3>${srt(ex).slice(0,50).map(x=>`<div class="row"><div><b>${h(x.desc)}</b><div class="mu">${x.date} · ${h(x.cat||'أخرى')} · ${h(x.empName)}${x.status=='pending'?' · بانتظار الرجوع':''}</div></div><div>${money(x.amount)} ${dl('expenses',x.id)}</div></div>`).join('')||empty('لا مصاريف بعد.')}</div>
 <div class="box"><h3>الفواتير</h3>${srt(inv).slice(0,50).map(x=>`<div class="row"><div><b>${h(x.clientName)}</b><div class="mu">${x.date} · ${h(x.empName)}${x.service?' · '+h(x.service):''}</div></div><div>${money(x.price)} ${dl('invoices',x.id)}</div></div>`).join('')||empty('لا فواتير بعد.')}</div>`},
async log(){const[i,p,x]=await load();return`<div class="box">${entryRows(i,p,x,true)}</div>`},
async new(){return`<div class="box br"><h3>فاتورة جديدة</h3><div class="g">${F('i1','اسم العميل')}${F('i2','رقم الهاتف','tel')}${F('i3','الخدمة / الشغل اللي عملته')}${F('i4','السعر','number')}${F('i5','المبلغ اللي استلمته الآن (اختياري)','number')}</div><button class="p" onclick="go(addInv)">حفظ الفاتورة</button></div>
 <div class="box"><h3>استلمت دفعة</h3><div class="g">${F('p1','اسم العميل')}${F('p2','المبلغ','number')}${F('p3','ملاحظة (اختياري)')}</div><button class="p" onclick="go(addPay)">تسجيل الاستلام</button></div>
 <div class="box"><h3>مصروف دفعته من جيبي</h3><div class="g">${F('x1','الوصف')}${F('x2','المبلغ','number')}</div><button class="p" onclick="go(()=>addExp(false))">إرسال المصروف</button></div>`},
async mine(){
 const[i,p,x]=await load(where('empId','==',me.uid)),o=opn(p,me.uid),w=owe(x,me.uid);
 return`<div class="box br"><div class="mu">حسابك الحالي</div><div class="big">${netTxt(o-w)}</div><div class="mu">استلمت ${money(o)} · دفعت من جيبك ${money(w)}</div></div><div class="box"><h3>آخر حركاتك</h3>${entryRows(i,p,x,false)}</div>`}
};

const PLANS=[[1,'شهر',150],[3,'3 شهور',400],[6,'6 شهور',700],[12,'سنة',1300]],PK=['الأساسية','بريميوم'];
const planName=n=>(PLANS.find(x=>x[0]==n)||[0,n+' شهر'])[1];
const sRow=c=>{const l=daysLeft(c),b=l<0?`<span class="neg">انتهى منذ ${-l} يوم</span>`:l<=7?`<span class="neg">باقي ${l} يوم</span>`:`<span class="pos">باقي ${l} يوم</span>`;
 return`<div class="row"><div><b>${h(c.clientName)}</b> · ${h(c.pkg)} · ${planName(c.plan)}<div class="mu">${c.start} ← ${endDate(c).toISOString().slice(0,10)}${c.phone?' · '+h(c.phone):''}</div><div>${b}</div></div><div>${money(c.price)} <button class="s" onclick="confirm('تجديد الاشتراك؟')&&go(()=>renew('${c.id}'))">تجديد</button> <button class="s d" onclick="confirm('حذف؟')&&go(()=>del('subs','${c.id}'))">حذف</button></div></div>`};
window.addSub=async()=>{const price=+v('s4');if(!v('s1')||!(price>0)||!v('s6'))throw Error('اكتب اسم العميل والسعر وتاريخ البدء');
 await addDoc(collection(db,'cm_subs'),{clientName:v('s1'),phone:v('s2'),pkg:v('s5'),plan:+v('s3'),price,start:v('s6'),date:v('s6'),empId:me.uid,empName:me.name})};
window.renew=async id=>{const c=(await getDoc(doc(db,'cm_subs',id))).data(),e=endDate(c),st=e>new Date()?e.toISOString().slice(0,10):today();
 await addDoc(collection(db,'cm_subs'),{...c,start:st,date:today()})};
window.addCo=async()=>{const a=+v('c2');if(!v('c1')||!(a>0))throw Error('اكتب الوصف والمبلغ');
 await addDoc(collection(db,'cm_expenses'),{date:v('c4')||today(),empId:'',empName:'الإدارة',desc:v('c1'),amount:a,cat:v('c3'),status:'paid'})};
window.pickDay=d=>{document.getElementById('t4').value=d;scrollTo({top:0,behavior:'smooth'});document.getElementById('t1').focus()};
let wk=0,fEmp='';
const wkRange=()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-d.getDay()+wk*7);return[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x.toISOString().slice(0,10)})};
const tcard=(t,adm)=>`<div class="row"><div><b>${h(t.title)}</b> · ${h(t.clientName)}<div class="mu">${h(t.time)||'بدون وقت'} · ${h(t.place)||'بدون موقع'}${adm?' · '+h(t.empName):''}${t.team&&t.team.length>1?' · مع: '+h(t.team.filter(n=>n!=t.empName).join('، ')):''}${t.onSite?' · وصل '+h(t.onSite):''}</div></div><div><select onchange="go(()=>setSt('${t.id}',this.value))">${ST.map(s=>`<option${s==t.status?' selected':''}>${s}</option>`).join('')}</select>${!adm&&!t.onSite?` <button class="s" onclick="go(()=>onSite('${t.id}'))">أنا بالموقع</button>`:''}${adm?` <button class="s d" onclick="confirm('حذف؟')&&go(()=>del('tasks','${t.id}'))">حذف</button>`:''}</div></div>`;
window.wkMove=n=>{wk=n?wk+n:0;show('week')};
window.setF=x=>{fEmp=x;show('week')};
window.addTask=async()=>{const c=[...document.querySelectorAll('#t3 input:checked')];if(!v('t1')||!v('t2')||!c.length||!v('t4'))throw Error('عبّي نوع الشغل والعميل واختر موظف واحد على الأقل والتاريخ');
 const b=writeBatch(db),team=c.map(x=>x.dataset.n),grp=Date.now().toString(36);c.forEach(x=>b.set(doc(collection(db,'cm_tasks')),{title:v('t1'),clientName:v('t2'),empId:x.value,empName:x.dataset.n,date:v('t4'),time:v('t5'),place:v('t6'),status:ST[0],...(c.length>1?{team,grp}:{})}));await b.commit()};
window.setSt=(id,s)=>updateDoc(doc(db,'cm_tasks',id),{status:s});
window.onSite=id=>updateDoc(doc(db,'cm_tasks',id),{onSite:new Date().toLocaleTimeString('ar-JO',{hour:'2-digit',minute:'2-digit'})});
const base=()=>({empId:me.uid,empName:me.name,date:today()});
window.addInv=async()=>{const price=+v('i4'),rec=+v('i5')||0;if(!v('i1')||!(price>0))throw Error('اكتب اسم العميل والسعر');
 await addDoc(collection(db,'cm_invoices'),{...base(),clientName:v('i1'),phone:v('i2'),service:v('i3'),price});
 if(rec>0)await addDoc(collection(db,'cm_payments'),{...base(),clientName:v('i1'),amount:rec,note:'مع الفاتورة',status:'open'})};
window.addPay=async()=>{const a=+v('p2');if(!v('p1')||!(a>0))throw Error('اكتب اسم العميل والمبلغ');
 await addDoc(collection(db,'cm_payments'),{...base(),clientName:v('p1'),amount:a,note:v('p3'),status:'open'})};
window.addExp=async(adm)=>{const a=+v('x2');if(!v('x1')||!(a>0))throw Error('اكتب الوصف والمبلغ');
 await addDoc(collection(db,'cm_expenses'),{...base(),empId:adm?'':me.uid,empName:adm?'الإدارة':me.name,desc:v('x1'),amount:a,status:adm?'paid':'pending'})};
window.addStaff=async()=>{if(!v('e1')||!v('e2')||v('e3').length<6)throw Error('عبّي الاسم والإيميل وكلمة مرور 6 أحرف+');
 const uid=await mkUser(v('e2'),v('e3'));await setDoc(doc(db,'cm_users',uid),{role:'employee',name:v('e1'),wage:+v('e4')||0})};
window.settle=async(id)=>{const b=writeBatch(db);
 (await list('cm_payments',where('empId','==',id),where('status','==','open'))).forEach(x=>b.update(doc(db,'cm_payments',x.id),{status:'settled'}));
 (await list('cm_expenses',where('empId','==',id),where('status','==','pending'))).forEach(x=>b.update(doc(db,'cm_expenses',x.id),{status:'paid'}));await b.commit()};
window.del=(c,id)=>deleteDoc(doc(db,'cm_'+c,id));
window.go=async(fn)=>{try{await fn();await show(cur);const t=document.createElement('div');t.className='toast';t.textContent='تم الحفظ ✓';document.body.append(t);setTimeout(()=>t.remove(),1800)}catch(e){alert('تعذّر الحفظ: '+(e.message||e))}};

async function show(tab){cur=tab;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('main').innerHTML=empty('جارٍ التحميل...');try{$('main').innerHTML=await T[tab]()}catch(e){$('main').innerHTML=empty('تعذّر التحميل: '+h(e.message))}}
window.show=show;
function shell(){const t=TABS[me.role];$('#root').innerHTML=`<header><img class="lg" src="${LOGO}" alt="Click"><div class="mu">${h(me.name)} · <a href="#" onclick="out();return false" style="color:var(--cy)">خروج</a></div></header><nav>${t.map(x=>`<button data-t="${x[0]}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}</nav><main></main>`;show(t[0][0])}
async function loginView(first){$('#root').innerHTML=`<div id="login"><img class="lg big" src="${LOGO}" alt="Click"><div class="box br"><h3>${first?'إنشاء حساب الأدمن (مرة وحدة)':'تسجيل الدخول'}</h3>${first?F('n','اسمك'):''}${F('em','الإيميل','email')}${F('pw','كلمة المرور','password')}<button class="p" style="width:100%" onclick="doLogin(${first})">${first?'إنشاء الأدمن':'دخول'}</button></div></div>`}
window.doLogin=async(first)=>{try{if(first){const r=await createUserWithEmailAndPassword(auth,v('em'),v('pw')),b=writeBatch(db);b.set(doc(db,'cm_meta','admin'),{uid:r.user.uid});b.set(doc(db,'cm_users',r.user.uid),{role:'admin',name:v('n')||'الأدمن'});await b.commit();location.reload()}else await signInWithEmailAndPassword(auth,v('em'),v('pw'))}catch(e){alert('تعذّر الدخول: '+e.message)}};
onAuthStateChanged(auth,async u=>{if(!u){me=null;const s=await getDoc(doc(db,'cm_meta','admin')).catch(()=>null);return loginView(s&&!s.exists())}
 const s=await getDoc(doc(db,'cm_users',u.uid));if(!s.exists()){await signOut(auth);return alert('الحساب غير مفعّل')}
 me={uid:u.uid,...s.data()};shell()});
</script>
